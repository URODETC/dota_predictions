name: Deploy
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/urodetc

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract tag
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dota-predictions-backend:latest
            ${{ env.IMAGE_PREFIX }}/dota-predictions-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dota-predictions-frontend:latest
            ${{ env.IMAGE_PREFIX }}/dota-predictions-frontend:${{ github.sha }}
  deploy:
    needs: build-and-push
    uses: appleboy/ssh-action@v1
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: ${{ secrets.SERVER_USER }}
      key: ${{ secrets.SERVER_SSH_KEY }}
      envs: TAG
      script: |
        set -e  
        cd /var/www/dota-predictions
        echo "▶ Pulling code"
        git pull origin main
        echo "▶ Pulling new images (tag: ${{ needs.build-and-push.outputs.tag }})"
        TAG=${{ needs.build-and-push.outputs.tag }}
        set -a && source /etc/dota/.env && set +a
        docker compose -f docker-compose.prod.yml pull backend frontend
        echo "▶ Restarting services
        docker compose -f docker-compose.prod.yml up -d \
              --no-deps --force-recreate \
              backend frontend
        echo "▶ Waiting for healthcheck"
        sleep 10
        docker compose -f docker-compose.prod.yml ps
        echo "▶ Cleanup old images"
        docker image prune -f
        echo "✅ Deploy complete (tag: $TAG)"
