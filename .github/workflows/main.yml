name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: echo -e "DATABASE_URL=postgresql+asyncpg://admin:admin@192.168.88.26:5432/dota_pred\nSECRET_KEY=123456" > .env
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{secrets.SERVER_SSH_KEY}}
          script: |
            cd /var/www/dota_predictions
            git pull
            docker compose build
            docker compose up -d
