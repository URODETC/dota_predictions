[project]
name = "dota-predictions"
version = "0.1.0"
requires-python = "==3.14.3"
dependencies = [
    "asyncpg==0.31.0",
    "bcrypt==4.3.0",
    "boto3>=1.42.63",
    "boto3-stubs~=1.42.63",
    "dotenv>=0.9.9",
    "fastapi==0.128.1",
    "gbnet==0.7.4",
    "joblib==1.5.3",
    "numpy==2.4.0rc1",
    "pandas==3.0.0",
    "pandas-stubs~=3.0.0",
    "passlib==1.7.4",
    "pyarrow>=23.0.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-jose==3.5.0",
    "requests>=2.32.5",
    "sqlalchemy==2.0.46",
    "uvicorn==0.40.0",
    "xgboost-cpu==3.2.0",
]

[dependency-groups]

dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

torch = [
    "torch==2.10.0",
    "xgboost-cpu==3.2.0",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = [
    "E501",
]
