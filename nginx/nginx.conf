server {
    listen 443 ssl;
    server_name dota-predictions.ru www.dota-predictions.ru;
    ssl_certificate /etc/letsencrypt/live/dota-predictions.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dota-predictions.ru/privkey.pem;

    location / {
        root /usr/share/nginx/html
        index index.html
        try_files $uri /index.html
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dota-predictions.ru www.dota-predictions.ru;
    if ($host = dota-predictions.ru) {
        return 301 https://$host$request_uri;
    }
    return 404;
}